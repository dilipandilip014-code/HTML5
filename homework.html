<!DOCTYPE html>
<html>
<head>
    <title>Homework</title>
</head>
<body style="background-color: lightyellow;">

    <!-- HEADING with Inline CSS -->
    <h1 style="color: blue; text-align: center;">My Homework Page</h1>

    <!-- PARAGRAPH with Inline CSS -->
    <p style="color: black; font-size: 20px; background-color: white; padding: 10px;">
        Hello, my name is Dilip. This is my homework. I am learning HTML and Inline CSS.
    </p>

    <!-- UNORDERED LIST with Inline CSS -->
    <h2 style="color: green;">My Hobbies</h2>
    <ul style="color: red; font-size: 18px;">
        <li>Cricket</li>
        <li>Music</li>
        <li>Coding</li>
    </ul>

    <!-- ORDERED LIST with Inline CSS -->
    <h2 style="color: green;">My Daily Routine</h2>
    <ol style="color: blue; font-size: 18px;">
        <li>Wake Up</li>
        <li>Study HTML</li>
        <li>Play</li>
        <li>Sleep</li>
    </ol>

</body>
</html>
